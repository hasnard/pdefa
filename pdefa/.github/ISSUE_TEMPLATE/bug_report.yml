name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill this out.
  - type: input
    id: version
    attributes:
      label: pdefa version
      placeholder: "1.0.3"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / CPU
      placeholder: "Windows 11 / Ryzen 5 7535HS"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback / error
      render: text